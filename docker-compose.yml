services:

  nats:
    image: nats:latest
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - nats

  notification-service:
    build: ./notification-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: nats://nats:4222
    depends_on:
      - nats

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - user-service